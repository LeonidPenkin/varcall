title: "Varcall — sequencing and variant calling QC"
report_comment: "Paired-end read quality before and after fastp, alignment quality and variant statistics. Mitochondrial training data; not a clinical validation."
module_order:
  - custom_content
  - fastqc:
      name: "FastQC (raw)"
      anchor: fastqc_raw
      path_filters:
        - "*raw_*_fastqc.zip"
  - fastp
  - fastqc:
      name: "FastQC (trimmed)"
      anchor: fastqc_trimmed
      path_filters:
        - "*trimmed_*_fastqc.zip"
  - samtools
  - bcftools
samtools_idxstats_always:
  - MT
  - chrM
samtools_idxstats_ignore: []
extra_fn_clean_exts:
  - ".coverage"
  - ".bcfstats"
  - ".flagstat"
read_count_multiplier: 0.001
read_count_prefix: "K"
read_count_desc: "thousands"
